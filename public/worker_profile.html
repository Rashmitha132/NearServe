<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worker Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: url("/uploads/booking.jpg") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 950px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.20);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .top-bar h1 {
      margin: 0;
      color: #111827;
      font-size: 42px;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn-blue {
      background: #2563eb;
      color: #fff;
    }

    .btn-orange {
      background: #f59e0b;
      color: #fff;
    }

    .btn-green {
      background: #22c55e;
      color: #fff;
    }

    .btn-call {
      background: #14b8a6;
      color: #fff;
    }

    .profile-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    .left-card,
    .right-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    .avatar {
      width: 95px;
      height: 95px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
    }

    .worker-name {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
      color: #111827;
    }

    .worker-role {
      text-align: center;
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 14px;
      text-transform: capitalize;
    }

    .rating-box {
      text-align: center;
      margin-bottom: 18px;
    }

    .stars {
      color: #fbbf24;
      font-size: 22px;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .rating-text {
      color: #374151;
      font-weight: 600;
    }

    .mini-info {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .info-item {
      background: #f9fafb;
      border-radius: 12px;
      padding: 12px 14px;
      color: #374151;
      font-size: 15px;
      border: 1px solid #e5e7eb;
    }

    .info-item strong {
      color: #111827;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin: 0 0 14px;
    }

    .profile-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      color: #374151;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .profile-box strong {
      color: #111827;
    }

    .feedback-list {
      display: grid;
      gap: 12px;
    }

    .feedback-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .feedback-text {
      color: #4b5563;
      line-height: 1.6;
      font-size: 15px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .confirm-btn {
      flex: 1;
      min-width: 220px;
      font-size: 16px;
      padding: 14px 18px;
    }

    .call-btn {
      min-width: 180px;
    }

    @media (max-width: 860px) {
      .profile-layout {
        grid-template-columns: 1fr;
      }

      .top-bar h1 {
        font-size: 34px;
      }
    }

    .feedback-list {
  display: grid;
  gap: 14px;
}

.feedback-card {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 16px 18px;
}

.feedback-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.feedback-name {
  font-weight: 700;
  color: #111827;
  font-size: 16px;
}

.feedback-stars {
  color: #fbbf24;
  font-size: 16px;
  letter-spacing: 1px;
}

.feedback-text {
  color: #4b5563;
  line-height: 1.6;
  font-size: 15px;
}
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h1>Worker Profile</h1>

      <div class="top-buttons">
        <button class="btn btn-blue" onclick="window.location.href='worker_list.html'">
          <i class="fa-solid fa-arrow-left"></i> Back to Worker List
        </button>

        <button class="btn btn-orange" onclick="window.location.href='booking.html'">
          <i class="fa-solid fa-house"></i> Back to Booking
        </button>
      </div>
    </div>

    <div class="profile-layout">
      <div class="left-card">
        <div class="avatar" id="avatar">W</div>
        <div class="worker-name" id="workerNameDisplay">Worker</div>
        <div class="worker-role" id="workerRoleDisplay">Service Professional</div>

        <div class="rating-box">
          <div class="stars" id="starDisplay">★★★★★</div>
          <div class="rating-text" id="ratingDisplay">5.0 rating</div>
        </div>

        <div class="mini-info">
          <div class="info-item">
            <strong><i class="fa-solid fa-phone"></i> Phone:</strong>
            <span id="phoneDisplay">-</span>
          </div>

          <div class="info-item">
            <strong><i class="fa-solid fa-envelope"></i> Email:</strong>
            <span id="emailDisplay">-</span>
          </div>
        </div>

        <div class="action-row">
          <a class="btn btn-call call-btn" id="callBtn" href="javascript:void(0)">
            <i class="fa-solid fa-phone-volume"></i> Call Worker
          </a>
        </div>
      </div>

      <div class="right-card">
        <div class="section-title">Worker Details</div>
        <div id="profile" class="profile-box"></div>

        <div class="section-title">Customer Feedback</div>
        <div class="feedback-list" id="feedbackList">
          <div class="feedback-card">
            <div class="feedback-text">No feedback yet</div>
          </div>
        </div>

        <div class="action-row">
          <button id="confirmBtn" class="btn btn-green confirm-btn">
            <i class="fa-solid fa-circle-check"></i> Confirm this Worker
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/worker_profile.js"></script>

</body>
</html>
