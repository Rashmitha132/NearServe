<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpenter Dashboard</title>
</head>
<body>

<h1>Carpenter Dashboard</h1>

<p>Status: <span id="status"></span></p>

<h2>Probation Jobs</h2>
<ul id="jobList"></ul>

<button id="logoutBtn">Logout</button>

<script>

const phone = localStorage.getItem("phone");
const role = localStorage.getItem("role");

if (!phone || role !== "carpenter") {
    alert("Not logged in as Carpenter");
    window.location.href = "login.html";
}

// =============================
// Fetch User + Jobs
// =============================
async function fetchData() {
    try {
        const userRes = await fetch(`/user/${phone}`);
        const user = await userRes.json();

        document.getElementById("status").innerText = user.status;

        // If still pending verification → go to upload page
        if (user.status === "pending_verification") {
            window.location.href = "upload_proof.html";
            return;
        }

        // If full access → show message (you can later replace with real jobs)
        if (user.status === "full_access") {
    window.location.href = "carpenter_requests.html";
    return;
}

        // If probation → fetch probation jobs
        const jobsRes = await fetch(`/my-jobs/${phone}`);
        const jobs = await jobsRes.json();

        const jobList = document.getElementById("jobList");
        jobList.innerHTML = "";

        jobs.forEach(job => {

            const li = document.createElement("li");

            li.innerHTML = `
                <b>${job.description || job.jobType}</b> 
                - Status: ${job.status}
                ${job.status === "pending" ? `
                    <button onclick="completeJob('${job._id}')">Complete</button>
                    <button onclick="rejectJob('${job._id}')">Reject</button>
                ` : ""}
            `;

            jobList.appendChild(li);
        });

    } catch (err) {
        console.error(err);
        alert("Error loading dashboard");
    }
}

// =============================
// COMPLETE JOB (WITH VIDEO PROOF)
// =============================
async function completeJob(jobId) {

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "video/*";

    fileInput.onchange = async () => {

        const file = fileInput.files[0];

        if (!file) {
            alert("Video proof is required to complete job.");
            return;
        }

        const formData = new FormData();
        formData.append("status", "completed");
        formData.append("videoProof", file);

        const res = await fetch(`/update-job/${jobId}`, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.error);
            return;
        }

        alert("Job completed successfully with video proof!");
        fetchData();
    };

    fileInput.click();
}

// =============================
// REJECT JOB
// =============================
async function rejectJob(jobId) {

    const res = await fetch(`/update-job/${jobId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "rejected" })
    });

    const data = await res.json();

    if (!res.ok) {
        alert(data.error);
        return;
    }

    alert("Job rejected.");
    fetchData();
}

// =============================
// LOGOUT
// =============================
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.clear();
    window.location.href = "login.html";
});

// Load dashboard
fetchData();

</script>

</body>
</html>
