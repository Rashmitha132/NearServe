<!DOCTYPE html>
<html lang="en">
<head>
<script src="./js/config.js"></script>
<script src="./js/auth-guard.js"></script>
<meta charset="UTF-8">
<title>Worker Chat - NearServe</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./css/pages/worker_chat_page-style-1.css">
  <script src="./js/toast.js"></script>
<link rel="stylesheet" href="./css/pages/worker_chat_page-inline-attrs.css">
  <link rel="stylesheet" href="./css/clean-background.css?v=20260507">
<style id="nearserve-white-background-override">
  html,
  body,
  body > .app,
  body > .shell,
  body > .mobile-shell,
  body > main,
  .main,
  main.main,
  .right-panel,
  main.right-panel,
  .content,
  .page-content,
  .main-content,
  .dashboard-main,
  .chat-body,
  .booking-content,
  .profile-content,
  .worker-content,
  .history-content,
  .requests-content {
    background: #ffffff !important;
    background-color: #ffffff !important;
    background-image: none !important;
  }

  body::before,
  body::after,
  .app::before,
  .app::after,
  .main::before,
  .main::after,
  main.main::before,
  main.main::after,
  .right-panel::before,
  .right-panel::after,
  main.right-panel::before,
  main.right-panel::after,
  .content::before,
  .content::after,
  .page-content::before,
  .page-content::after,
  .main-content::before,
  .main-content::after,
  .dashboard-main::before,
  .dashboard-main::after,
  .chat-body::before,
  .chat-body::after {
    content: none !important;
    display: none !important;
    background: none !important;
    background-image: none !important;
    box-shadow: none !important;
  }
</style>
<link rel="stylesheet" href="./css/nearserve-premium-layer.css?v=20260507a">
</head>
<body>

<div class="chat-topbar">
  <button class="back-btn" id="backBtn">
    <i class="fa-solid fa-arrow-left"></i>
    Back
  </button>
  <div class="chat-customer-avatar" id="customerAvatar">C</div>
  <div class="chat-customer-info">
    <div class="chat-customer-name" id="customerName">Customer</div>
    <div class="chat-customer-sub" id="customerSub">Booking chat</div>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <div class="empty-chat" id="emptyChatMsg">
    <div class="empty-chat-icon">💬</div>
    <div class="empty-chat-title">No messages yet</div>
    <p class="worker_chat_page-inline-style-1">Start the conversation with the customer.</p>
  </div>
</div>

<div class="chat-input-bar">
  <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1"></textarea>
  <button class="send-btn" id="sendBtn" title="Send message">
    <i class="fa-solid fa-paper-plane"></i>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="./js/pages/worker_chat_page-script-1.js"></script>

</body>
</html>
