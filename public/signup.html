<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - QuickServe</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── MESH BACKGROUND ── */
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 20% 50%, rgba(29,78,216,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 30%, rgba(13,148,136,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 60% 80%, rgba(59,130,246,0.12) 0%, transparent 60%),
      #0f172a;
  }
  .bg-mesh::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 0%, transparent 100%);
  }
  .bg-mesh::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle 380px at 10% 85%, rgba(13,148,136,0.11) 0%, transparent 70%),
      radial-gradient(circle 320px at 90% 80%, rgba(29,78,216,0.11) 0%, transparent 70%);
  }

  /* ── DECORATIVE ORBS ── */
  .orb {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 1;
  }
  .orb1 {
    width: 340px; height: 340px; top: -90px; left: -90px;
    background: radial-gradient(circle at 40% 40%, rgba(29,78,216,0.2), rgba(13,148,136,0.06) 60%, transparent 80%);
    animation: orbDrift1 18s ease-in-out infinite alternate;
  }
  .orb2 {
    width: 280px; height: 280px; bottom: -70px; right: -70px;
    background: radial-gradient(circle at 60% 60%, rgba(13,148,136,0.22), rgba(29,78,216,0.06) 60%, transparent 80%);
    animation: orbDrift2 14s ease-in-out infinite alternate;
  }
  .orb3 {
    width: 190px; height: 190px; top: 28%; right: 7%;
    background: radial-gradient(circle at 40% 40%, rgba(59,130,246,0.14), transparent 70%);
    animation: orbDrift3 20s ease-in-out infinite alternate;
  }
  .orb4 {
    width: 150px; height: 150px; bottom: 18%; left: 5%;
    background: radial-gradient(circle at 40% 40%, rgba(13,148,136,0.14), transparent 70%);
    animation: orbDrift4 16s ease-in-out infinite alternate;
  }
  .orb5 {
    width: 110px; height: 110px; top: 14%; left: 18%;
    background: radial-gradient(circle at 40% 40%, rgba(99,102,241,0.13), transparent 70%);
    animation: orbDrift1 22s ease-in-out infinite alternate-reverse;
  }
  @keyframes orbDrift1 { from{transform:translate(0,0) scale(1)} to{transform:translate(30px,40px) scale(1.08)} }
  @keyframes orbDrift2 { from{transform:translate(0,0) scale(1)} to{transform:translate(-25px,-35px) scale(1.1)} }
  @keyframes orbDrift3 { from{transform:translate(0,0) scale(1)} to{transform:translate(-20px,30px) scale(0.92)} }
  @keyframes orbDrift4 { from{transform:translate(0,0) scale(1)} to{transform:translate(20px,-25px) scale(1.06)} }

  /* ── FLOATING RINGS ── */
  .ring {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 1;
    animation: ringPulse ease-in-out infinite alternate;
  }
  .ring1 { width:520px; height:520px; top:-200px; right:-160px; border:1px solid rgba(29,78,216,0.12); animation-duration:10s; }
  .ring2 { width:380px; height:380px; bottom:-130px; left:-110px; border:1px solid rgba(13,148,136,0.12); animation-duration:13s; animation-delay:2s; }
  .ring3 { width:240px; height:240px; top:38%; left:2%; border:1px solid rgba(59,130,246,0.09); animation-duration:9s; animation-delay:4s; }
  @keyframes ringPulse { from{transform:scale(1);opacity:0.5} to{transform:scale(1.06);opacity:1} }

  /* ── PARTICLE CANVAS ── */
  #particleCanvas {
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none; width: 100%; height: 100%;
  }

  /* ── CARD ── */
  .login-container {
    position: relative; z-index: 10;
    width: 420px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 30px;
    padding: 38px 38px 32px;
    box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06) inset, inset 0 1px 0 rgba(255,255,255,0.15);
    animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
    /* allow scroll if content taller than viewport */
    max-height: 96vh;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .login-container::-webkit-scrollbar { display: none; }

  /* shimmer border */
  .login-container::before {
    content: '';
    position: absolute; inset: -1.5px; border-radius: 31px;
    background: linear-gradient(135deg, rgba(29,78,216,0.7), rgba(13,148,136,0.5), rgba(59,130,246,0.6), rgba(29,78,216,0.7));
    background-size: 300% 300%;
    z-index: -1;
    animation: borderShimmer 5s linear infinite;
  }

  @keyframes cardIn {
    from { opacity:0; transform: translateY(40px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes borderShimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ── LOGO ── */
  .logo { text-align: center; margin-bottom: 18px; }
  .logo-icon {
    width: 68px; height: 68px;
    margin: 0 auto 10px;
    background: linear-gradient(135deg, #1d4ed8, #0d9488);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(29,78,216,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    animation: logoPulse 3.5s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%,100% { box-shadow: 0 8px 28px rgba(29,78,216,0.5); }
    50%      { box-shadow: 0 8px 44px rgba(13,148,136,0.65); }
  }
  .logo h2 {
    font-size: 1.55rem; font-weight: 800; color: #fff;
    letter-spacing: 0.5px; text-shadow: 0 2px 14px rgba(29,78,216,0.45);
  }

  /* ── HEADING ── */
  form h3 {
    text-align: center; color: rgba(255,255,255,0.88);
    font-size: 1.05rem; font-weight: 700;
    margin-bottom: 18px; letter-spacing: 0.3px;
  }

  /* ── INPUT BOXES ── */
  .input-box { position: relative; margin-bottom: 12px; }

  .input-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 33px; height: 33px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .input-box:focus-within .input-icon {
    transform: translateY(-50%) scale(1.13);
    box-shadow: 0 5px 16px rgba(0,0,0,0.35);
  }

  .icon-name     { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
  .icon-email    { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .icon-phone    { background: linear-gradient(135deg, #0d9488, #14b8a6); }
  .icon-password { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
  .icon-role     { background: linear-gradient(135deg, #fbbf24, #f59e0b); }

  .input-box input,
  .input-box select {
    width: 100%; padding: 12px 16px 12px 57px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 13px;
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 0.91rem;
    font-family: 'Nunito', sans-serif;
    outline: none; transition: all 0.28s ease;
  }
  .input-box input::placeholder { color: rgba(255,255,255,0.38); }
  .input-box select { color: rgba(255,255,255,0.5); appearance: none; cursor: pointer; }
  .input-box select option { background: #0f172a; color: #fff; }
  .input-box input:focus,
  .input-box select:focus {
    border-color: rgba(59,130,246,0.7);
    background: rgba(255,255,255,0.09);
    box-shadow: 0 0 0 3px rgba(29,78,216,0.18), 0 4px 20px rgba(29,78,216,0.12);
    color: #fff;
  }

  /* ── BUTTON ── */
  button[type="submit"] {
    width: 100%; padding: 13px; margin-top: 8px;
    border: none; border-radius: 13px;
    background: linear-gradient(135deg, #1d4ed8 0%, #0d9488 100%);
    color: #fff; font-size: 1rem;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    letter-spacing: 0.8px; cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: 0 6px 26px rgba(29,78,216,0.45);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button[type="submit"]::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(13,148,136,0.5); }
  button[type="submit"]:hover::after { opacity: 1; }
  button[type="submit"]:active { transform: translateY(0); }

  /* ── FOOTER ── */
  .signup-link {
    text-align: center; margin-top: 16px;
    color: rgba(255,255,255,0.45); font-size: 0.88rem;
  }
  .signup-link a {
    color: #34d399; text-decoration: none;
    font-weight: 700; transition: color 0.2s;
  }
  .signup-link a:hover { color: #60a5fa; }
</style>
</head>
<body>

<!-- Mesh Background -->
<div class="bg-mesh"></div>

<!-- Decorative Orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>
<div class="orb orb5"></div>

<!-- Floating Rings -->
<div class="ring ring1"></div>
<div class="ring ring2"></div>
<div class="ring ring3"></div>

<!-- Particle Canvas -->
<canvas id="particleCanvas"></canvas>

<div class="login-container">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">
      <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="5" width="30" height="22" rx="7" fill="white" fill-opacity="0.92"/>
        <circle cx="12" cy="16" r="2.8" fill="#60a5fa"/>
        <circle cx="19" cy="16" r="2.8" fill="#34d399"/>
        <circle cx="26" cy="16" r="2.8" fill="#a78bfa"/>
        <path d="M7 27 L3 36 L15 30" fill="white" fill-opacity="0.92"/>
        <rect x="26" y="19" width="18" height="14" rx="5" fill="#14b8a6" fill-opacity="0.88"/>
        <circle cx="32" cy="26" r="1.7" fill="white"/>
        <circle cx="37" cy="26" r="1.7" fill="white"/>
        <path d="M29 33 L25 40 L36 35" fill="#14b8a6" fill-opacity="0.88"/>
      </svg>
    </div>
    <h2>QuickServe</h2>
  </div>

  <form id="signupForm">
    <h3>Create Account ✨</h3>

    <!-- Name -->
    <div class="input-box">
      <div class="input-icon icon-name">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <input type="text" id="name" name="name" placeholder="Your Name">
    </div>

    <!-- Email -->
    <div class="input-box">
      <div class="input-icon icon-email">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="3"/>
          <polyline points="2,4 12,13 22,4"/>
        </svg>
      </div>
      <input type="email" id="email" name="email" placeholder="Email Address">
    </div>

    <!-- Phone -->
    <div class="input-box">
      <div class="input-icon icon-phone">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.07 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.09a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
      </div>
      <input type="text" id="phone" name="phone" placeholder="Phone Number">
    </div>

    <!-- Password -->
    <div class="input-box">
      <div class="input-icon icon-password">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <input type="password" id="password" name="password" placeholder="Password">
    </div>

    <!-- Role -->
    <div class="input-box">
      <div class="input-icon icon-role">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <select id="role" name="role">
        <option value="">Select Role</option>
        <option value="customer">Customer</option>
        <option value="plumber">Plumber</option>
        <option value="electrician">Electrician</option>
        <option value="carpenter">Carpenter</option>
      </select>
    </div>

    <button type="submit">Sign Up</button>

    <p class="signup-link">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </form>
</div>

<!-- Particle System (identical to login page) -->
<script>
  const canvas = document.getElementById("particleCanvas");
  const ctx = canvas.getContext("2d");
  let particles = [];

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener("resize", resize);

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 1.8 + 0.4;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = (Math.random() - 0.5) * 0.3;
      const colors = ["rgba(59,130,246,","rgba(13,148,136,","rgba(29,78,216,","rgba(99,102,241,","rgba(20,184,166,"];
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.alpha = Math.random() * 0.45 + 0.1;
      this.life = 0;
      this.maxLife = Math.random() * 300 + 200;
    }
    update() {
      this.x += this.speedX; this.y += this.speedY; this.life++;
      if (this.life > this.maxLife) this.reset();
      if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
      const fade = this.life < 40 ? this.life/40 : this.life > this.maxLife-40 ? (this.maxLife-this.life)/40 : 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color + (this.alpha * fade) + ")";
      ctx.fill();
    }
  }

  for (let i = 0; i < 80; i++) {
    const p = new Particle();
    p.life = Math.random() * p.maxLife;
    particles.push(p);
  }

  function drawConnections() {
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 100) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = "rgba(59,130,246," + (0.06 * (1 - dist/100)) + ")";
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawConnections();
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }
  animate();
</script>

<script src="js/signup.js"></script>
</body>
</html>
