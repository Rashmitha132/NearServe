<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - QuickServe</title>
</head>
<body>
  <h1>My Booking History</h1>
  <h2 id="welcomeUser"></h2>

  <button id="logoutBtn" style="margin-bottom:20px;">Logout</button>

  <table border="1" id="bookingTable" cellpadding="8">
    <thead>
      <tr>
        <th>Service</th>
        <th>Worker</th>
        <th>Address</th>
        <th>Date</th>
        <th>Status</th>
        <th>Arrival Time</th>
        <th>Worker Message</th>
        <th>Reject Reason</th>
        <th>Rate</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <br />
  <button onclick="window.location.href='booking.html'">Book Another Service</button>

  <script src="js/mybooking.js"></script>
</body>
</html>
