<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - QuickServe</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-bg">

<div class="bg-overlay"></div>

  <div class="page-wrap">
    <div class="admin-glass-card">

      <!-- Header -->
      <div class="admin-topbar">
        <div class="admin-title-wrap">
          <div class="admin-logo-circle">
            <i class="fa-solid fa-user-shield"></i>
          </div>
          <div>
            <h1 class="admin-main-title">Admin Dashboard</h1>
            <p class="admin-subtitle">Manage worker proof PDFs and submitted job verification videos</p>
          </div>
        </div>

        <div class="admin-actions">
          <button class="top-btn refresh-btn" id="refreshBtn">
            <i class="fa-solid fa-rotate-right"></i> Refresh
          </button>

          <a href="/admin_history.html" class="top-btn history-btn">
            <i class="fa-solid fa-clock-rotate-left"></i> View History
          </a>

          <button class="top-btn logout-btn" id="adminLogout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>

      <!-- Main 2-column layout -->
      <div class="admin-sections-grid">

        <!-- Worker PDF verification -->
        <div class="verify-panel">
          <div class="panel-header">
            <div class="panel-icon worker-icon">
              <i class="fa-solid fa-file-pdf"></i>
            </div>
            <div>
              <h2>Worker Proof Verification</h2>
              <p>Submitted PDFs by workers</p>
            </div>
          </div>

          <div class="panel-body">
            <ul id="workerList" class="verify-list"></ul>
          </div>
        </div>

        <!-- Job video verification -->
        <div class="verify-panel">
          <div class="panel-header">
            <div class="panel-icon video-icon">
              <i class="fa-solid fa-video"></i>
            </div>
            <div>
              <h2>Job Verification Video</h2>
              <p>Submitted worker videos</p>
            </div>
          </div>

          <div class="panel-body">
            <ul id="jobList" class="verify-list"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/admin_dashboard.js"></script>
</body>
</html>
