<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Worker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: url("/uploads/booking.jpg") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 44px;
      color: #111827;
    }

    .title-wrap p {
      margin: 10px 0 0;
      color: #4b5563;
      font-size: 18px;
    }

    .back-btn {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
    }

    .back-btn:hover {
      transform: translateY(-2px);
    }

    #list {
      margin-top: 24px;
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .worker-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      transition: 0.25s ease;
      cursor: pointer;
    }

    .worker-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.12);
    }

    .worker-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .worker-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, #60a5fa, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .worker-name {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }

    .worker-role {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .worker-info {
      color: #374151;
      font-size: 15px;
      line-height: 1.8;
    }

    .worker-info strong {
      color: #111827;
    }

    .view-profile {
      margin-top: 14px;
      display: inline-block;
      background: #22c55e;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      .page {
        padding: 22px;
      }

      .title-wrap h1 {
        font-size: 32px;
      }

      .title-wrap p {
        font-size: 16px;
      }

      .back-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="title-wrap">
        <h1>Select a Worker</h1>
        <p id="roleTitle"></p>
      </div>

      <button class="back-btn" onclick="window.location.href='booking.html'">
        ← Back to Booking
      </button>
    </div>

    <div id="list"></div>
  </div>

  <script src="js/worker_list.js"></script>

  <script>
    /* Optional beautification for cards generated by JS */
    const observer = new MutationObserver(() => {
      const cards = document.querySelectorAll("#list > div");
      cards.forEach(card => {
        if (!card.classList.contains("worker-card")) {
          const lines = card.innerHTML.split("<br>").map(x => x.trim()).filter(Boolean);

          let name = "";
          let phone = "";
          let email = "";
          let rating = "";
          let last = "";

          lines.forEach(line => {
            const text = line.replace(/<[^>]*>/g, "").trim();
            if (!name && text) name = text;
            else if (text.toLowerCase().startsWith("phone:")) phone = text;
            else if (text.toLowerCase().startsWith("email:")) email = text;
            else if (text.toLowerCase().startsWith("rating:")) rating = text;
            else last = text;
          });

          const firstLetter = name ? name.charAt(0).toUpperCase() : "W";
          const roleText = document.getElementById("roleTitle")?.textContent || "Available workers";

          card.className = "worker-card";
          card.innerHTML = `
            <div class="worker-top">
              <div class="worker-avatar">${firstLetter}</div>
              <div>
                <h3 class="worker-name">${name || "Worker"}</h3>
                <p class="worker-role">${roleText}</p>
              </div>
            </div>

            <div class="worker-info">
              <div><strong>${phone || ""}</strong></div>
              <div>${email || ""}</div>
              <div>${rating || ""}</div>
            </div>

            <div class="view-profile">${last || "Click to view profile"}</div>
          `;
        }
      });
    });

    observer.observe(document.getElementById("list"), { childList: true, subtree: true });
  </script>
</body>
</html>
