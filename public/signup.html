<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - NearServe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="signup-page">

  <div class="bg-mesh"></div>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="orb orb4"></div>
  <div class="orb orb5"></div>

  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <canvas id="particleCanvas"></canvas>

  <div class="login-container signup-container">
    <div class="logo">
      <div class="logo-icon">
        <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="5" width="30" height="22" rx="7" fill="white" fill-opacity="0.92"/>
          <circle cx="12" cy="16" r="2.8" fill="#60a5fa"/>
          <circle cx="19" cy="16" r="2.8" fill="#34d399"/>
          <circle cx="26" cy="16" r="2.8" fill="#a78bfa"/>
          <path d="M7 27 L3 36 L15 30" fill="white" fill-opacity="0.92"/>
          <rect x="26" y="19" width="18" height="14" rx="5" fill="#14b8a6" fill-opacity="0.88"/>
          <circle cx="32" cy="26" r="1.7" fill="white"/>
          <circle cx="37" cy="26" r="1.7" fill="white"/>
          <path d="M29 33 L25 40 L36 35" fill="#14b8a6" fill-opacity="0.88"/>
        </svg>
      </div>
      <h2>NearServe</h2>
    </div>

    <form id="signupForm">
      <h3>Create Account ✨</h3>

      <div class="input-box">
        <div class="input-icon icon-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <input type="text" id="name" name="name" placeholder="Your Name" />
      </div>

      <div class="input-box">
        <div class="input-icon icon-email">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="3"/>
            <polyline points="2,4 12,13 22,4"/>
          </svg>
        </div>
        <input type="email" id="email" name="email" placeholder="Email Address" />
      </div>

      <div class="input-box">
        <div class="input-icon icon-phone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.15 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.07 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 9.09a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </div>
        <input type="text" id="phone" name="phone" placeholder="Phone Number" />
      </div>

      <div class="input-box">
        <div class="input-icon icon-password">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <input type="password" id="password" name="password" placeholder="Password" />
      </div>

      <div class="input-box">
        <div class="input-icon icon-role">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <select id="role" name="role">
          <option value="">Select Role</option>
          <option value="customer">Customer</option>
          <option value="plumber">Plumber</option>
          <option value="electrician">Electrician</option>
          <option value="carpenter">Carpenter</option>
        </select>
      </div>

      <button type="submit" id="signupBtn">Sign Up</button>

      <p class="signup-link">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </form>
  </div>

  <script src="js/signup.js"></script>
</body>
</html>
