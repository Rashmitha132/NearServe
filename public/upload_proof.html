<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Proof - QuickServe</title>

  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <img src="/uploads/verify.png" alt="Verification Logo">
      <h2>Worker Verification</h2>
    </div>

    <!-- IMPORTANT: enctype + action -->
    <form id="proofForm" enctype="multipart/form-data">
      <h3>Upload Your Proof to Start Probation</h3>

      <div class="upload-box">
        <div class="upload-title">
          <i class="fa fa-file-pdf"></i>
          <span>Upload PDF only</span>
        </div>

        <!-- PDF only -->
        <input type="file" id="proofFile" name="proof" accept="application/pdf" />
        <p class="hint">Max size: <b>2 MB</b></p>

        <!-- Preview area -->
        <div id="preview" class="preview hidden">
          <div class="preview-row">
            <i class="fa fa-file-pdf"></i>
            <div>
              <div id="fileName" class="file-name"></div>
              <div id="fileSize" class="file-size"></div>
            </div>
          </div>
        </div>

        <p id="errorMsg" class="error hidden"></p>
      </div>

      <button id="submitBtn" type="submit" disabled>Submit Proof</button>
    </form>

  </div>

  <script src="js/upload_proof.js"></script>
</body>
</html>
