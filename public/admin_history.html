<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin History - QuickServe</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-bg">

<div class="bg-overlay"></div>

<div class="page-wrap">
  <div class="card admin-card">
    <div class="card-header">
      <div class="brand">
        <img src="/uploads/shield.png" alt="Shield">
        <div>
          <h1>Verification History</h1>
          <small>Approved and rejected worker/job records</small>
        </div>
      </div>

      <div class="header-actions">
        <a href="/admin_dashboard.html" class="btn btn-secondary">
          <i class="fa fa-arrow-left"></i> Back to Dashboard
        </a>
        <button class="btn btn-logout" id="adminLogout">
          <i class="fa fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>

    <div class="card-body">
      <div class="section-title">History Records</div>
      <div id="historyWrap">
        <p class="note">Loading history...</p>
      </div>
    </div>
  </div>
</div>

<script src="js/admin_history.js"></script>
</body>
</html>
