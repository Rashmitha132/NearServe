<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - QuickServe</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="admin-bg">
<div class="bg-overlay"></div>

<div class="login-container">
  <div class="logo">
    <img src="/uploads/admin.png" alt="Admin Logo">
    <h2>QuickServe Admin</h2>
  </div>

  <form id="adminLoginForm">
    <h3>Admin Login</h3>

    <div class="input-box">
      <i class="fa fa-user"></i>
      <input id="adminUser" type="text" placeholder="Admin Username" required>
    </div>

    <div class="input-box">
      <i class="fa fa-lock"></i>
      <input id="adminPass" type="password" placeholder="Admin Password" required>
    </div>

    <button type="submit">Login</button>
    <p class="signup-link" id="msg" style="margin-top:12px;"></p>
  </form>
</div>

<script src="js/admin_login.js"></script>
</body>
</html>
